name: Release-Master

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  Deploy:
    permissions:
      contents: write
    name: deploy
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PUBLISH_EMAIL: ${{ secrets.PUBLISH_EMAIL }}
      PUBLISH_USERNAME: ${{ secrets.PUBLISH_USERNAME }}
    strategy:
      matrix:
        node-version: [16.x]
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
        with:
          persist-credentials: true  # kept: job runs git commands that use the checkout token
      - uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          cache: yarn
          node-version: ${{ matrix.node-version }}
      - name: Create .npmrc
        run: echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> .npmrc
      - run: git config --global user.email 'github-actions[bot]'
      - run: git config --global user.name 'github-actions[bot]@users.noreply.github.com'
      - name: Yarn install dependencies
        run: yarn install --frozen-lockfile
      - name: Lerna Build Projects
        run: lerna run build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: master
        run: lerna publish from-package --yes --no-verify-access --dist-tag latest
